name: flutter_project
description: "RedEast Store storefront."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logos/
    - assets/brand/fonts/LICENSE-InstrumentSerif-OFL.txt
    - assets/brand/fonts/LICENSE-CabinetGrotesk-FFL.txt
  fonts:
    - family: CabinetGrotesk
      fonts:
        - asset: assets/brand/fonts/CabinetGrotesk-Regular.ttf
        - asset: assets/brand/fonts/CabinetGrotesk-Medium.ttf
          weight: 500
        - asset: assets/brand/fonts/CabinetGrotesk-Bold.ttf
          weight: 700
    - family: InstrumentSerif
      fonts:
        - asset: assets/brand/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/brand/fonts/InstrumentSerif-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/logos/logo.alone.dark.1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/logos/logo.alone.dark.1024.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/logos/logo.alone.dark.1024.png"
    background_color: "#FFFFFF"
    theme_color: "#363636"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#F7F7F5"
  image: "assets/brand/logos/logo.alone.dark.192.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#F7F7F5"
    image: "assets/brand/logos/logo.alone.dark.192.png"
